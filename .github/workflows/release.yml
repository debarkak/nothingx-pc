name: Weekly Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Universal Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter

      - name: Build executable (CLI)
        run: |
          pyinstaller --onefile --name nothingx-cli-universal nothingx.py

      - name: Build executable (GUI)
        run: |
          pyinstaller --onefile --name nothingx-gui-universal nothingx_gui.py

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-cli
          path: dist/nothingx-cli-universal

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-gui
          path: dist/nothingx-gui-universal

  weekly-release:
    name: Create Weekly Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: bin/

      - name: Organize release binaries
        run: |
          mkdir -p dist
          cp bin/binary-cli/nothingx-cli-universal dist/nothingx-cli-universal
          cp bin/binary-gui/nothingx-gui-universal dist/nothingx-gui-universal
          chmod +x dist/*

      - name: Generate Tag and Date
        id: vars
        run: |
          DATE=$(date +'%Y.%m.%d')
          echo "tag=weekly-${DATE}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT

      - name: Generate Custom Release Notes
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | head -n 1)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="--since=7.days"
          fi

          echo "### changes:" > release_notes.md
          echo "" >> release_notes.md
          git log $RANGE --no-merges --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" >> release_notes.md
          echo "" >> release_notes.md
          echo "### implementation status" >> release_notes.md
          echo "" >> release_notes.md
          sed -n '/| Feature |/,/| 🔴 |/p' README.md >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "### full changelog" >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Weekly Build - ${{ steps.vars.outputs.date }}
          body_path: release_notes.md
          generate_release_notes: true
          draft: false
          prerelease: true
          files: |
            dist/nothingx-cli-universal
            dist/nothingx-gui-universal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
